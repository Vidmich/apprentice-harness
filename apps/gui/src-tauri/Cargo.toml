[package]
name = "apprentice-harness-gui"
description = "apprentice-harness desktop application (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "apprentice_harness_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
apprentice-api = { workspace = true }
apprentice-client = { workspace = true }
apprentice-common = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
