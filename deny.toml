# cargo-deny configuration (`just deny` / the CI `deny` job).
# Advisories and sources are enforced. The licence allow-list is what the
# current dependency tree needs; it is finalised together with the project
# licence (still `LicenseRef-TBD`, see Cargo.toml), which is why the
# workspace crates themselves are skipped below.

[graph]
# Check every platform the project ships on, not just the host running the
# check: the lockfile has Windows-, macOS- and Linux-only branches.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[output]
feature-depth = 1

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Unmaintained crates reachable only through Tauri; nothing this project can
# change until Tauri moves on. Vulnerabilities are never ignored here.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via gtk/glib-macros (Linux GUI backend)" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range via tauri-utils/urlpattern" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common via tauri-utils/urlpattern" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property via tauri-utils/urlpattern" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version via tauri-utils/urlpattern" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident via tauri-utils/urlpattern" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# The workspace crates carry `LicenseRef-TBD` until the licence is chosen.
ignore = true

[bans]
# Duplicate versions are common in the Tauri tree; reported, not enforced.
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
