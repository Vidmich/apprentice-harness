[project]
name = "apprentice-ml"
version = "0.1.0"
description = "Training, evaluation and dataset tooling for apprentice-harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LicenseRef-TBD" }
dependencies = []

[project.scripts]
apprentice-ml = "apprentice_ml.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apprentice_ml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
