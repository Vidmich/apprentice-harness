[package]
name = "apprentice-core"
description = "Runtime, tools, mentor adapter, trace store and inference for apprentice-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "apprentice_core"

[dependencies]
apprentice-api = { workspace = true }
apprentice-common = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
globset = { workspace = true }
grep-matcher = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
ignore = { workspace = true }
jsonschema = { workspace = true }
keyring = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }
sysinfo = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Job objects for the shell tool: a command's whole process tree dies
# with the call (see `tools::shell::process`), plus `CREATE_NO_WINDOW`.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# `killpg` for the shell tool's process groups.
libc = "0.2"

[dev-dependencies]
apprentice-client = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
