[package]
name = "apprentice-client"
description = "Daemon discovery, spawning and typed JSON-RPC client for apprentice-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "apprentice_client"

[dependencies]
apprentice-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Only `SetHandleInformation`, so a spawned daemon does not inherit our
# stdio pipes (see `connect::spawn_detached`).
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
